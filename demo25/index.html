<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halide Collective — Film Photography Studio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1712;color:#efe6d8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;overflow-x:hidden}
  canvas#grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.08;mix-blend-mode:overlay}
  .vignette{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.7)}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(239,230,216,.08);border:1px solid rgba(239,230,216,.2)}
  .badge b{color:#d9a24a}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#d9a24a;margin-bottom:20px}
  h1{font-size:clamp(32px,6vw,64px);font-weight:700;letter-spacing:-.02em;max-width:700px}
  p{color:#bcae95;max-width:460px;margin:20px auto 0;line-height:1.7}
  .frames{display:flex;gap:16px;margin-top:50px;flex-wrap:wrap;justify-content:center;padding:0 24px 90px}
  .frame{width:180px;height:230px;border-radius:4px;border:6px solid #efe6d8}
  .f1{background:linear-gradient(160deg,#6b5a3f,#241d12)}
  .f2{background:linear-gradient(160deg,#8f7250,#2c2213)}
  .f3{background:linear-gradient(160deg,#4a5a45,#151a12)}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Noise / Film Grain Overlay</b>（全站疊加動態噪點紋理，模擬底片質感）</div>
<div class="vignette"></div>
<canvas id="grain"></canvas>
<main>
  <div class="kicker">Halide Collective · 底片攝影工作室</div>
  <h1>Shot on Film, Felt Forever</h1>
  <p>整個畫面上疊了一層用 canvas 每幀重繪的隨機噪點，搭配 mix-blend-mode: overlay 和邊角暗角，做出類比底片顆粒感——攝影/影視/復古品牌很愛這招。</p>
  <div class="frames">
    <div class="frame f1"></div>
    <div class="frame f2"></div>
    <div class="frame f3"></div>
  </div>
</main>

<script>
const canvas = document.getElementById('grain');
const ctx = canvas.getContext('2d');
const W = 160, H = 160;
canvas.width = W; canvas.height = H;
canvas.style.width = '100vw'; canvas.style.height = '100vh';

const imgData = ctx.createImageData(W, H);
function drawNoise(){
  const buf = imgData.data;
  for (let i=0;i<buf.length;i+=4){
    const v = Math.random()*255;
    buf[i]=v; buf[i+1]=v; buf[i+2]=v; buf[i+3]=255;
  }
  ctx.putImageData(imgData, 0, 0);
}
function tick(){ drawNoise(); requestAnimationFrame(tick); }
tick();
</script>
</body>
</html>
