<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulseband — Health Wearable</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0810;color:#f4f0f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden;min-height:100vh}
  .mesh{position:fixed;inset:-10%;z-index:0;filter:blur(70px);opacity:.85}
  .mesh div{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15vw;font-weight:800;color:rgba(255,255,255,.9);text-align:center;white-space:nowrap}
  .b1{width:44vw;height:44vw;left:-10%;top:-5%;background:#ff5db3;animation:float1 16s ease-in-out infinite}
  .b2{width:38vw;height:38vw;right:-8%;top:10%;background:#7c5cff;animation:float2 20s ease-in-out infinite}
  .b3{width:36vw;height:36vw;left:20%;bottom:-15%;background:#5eead4;animation:float3 18s ease-in-out infinite}
  .b4{width:30vw;height:30vw;right:15%;bottom:-10%;background:#ffd166;animation:float1 22s ease-in-out infinite reverse}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(0.9)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,-7%) scale(1.1)}}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px)}
  .badge b{color:#ff5db3}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ff5db3;margin-bottom:20px}
  h1{font-size:clamp(38px,7vw,76px);font-weight:700;letter-spacing:-.02em;line-height:1.06;max-width:800px}
  h1 span{background:linear-gradient(135deg,#ff5db3,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#cabfe0;font-size:17px;max-width:500px;margin:22px 0 34px;line-height:1.7}
  .cta{display:inline-flex;gap:10px;padding:14px 28px;border-radius:999px;background:#fff;color:#0b0810;font-weight:700}
  .cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;max-width:760px;margin:0 auto 90px;padding:0 24px}
  .cards div{padding:20px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}
  .cards b{display:block;font-size:26px}
  .cards span{font-size:12px;color:#cabfe0}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Mesh Gradient</b>（多色模糊漸層動態飄動）</div>
<!-- 適合產業文字直接寫在色塊裡，跟著 filter:blur(70px) 一起被模糊、融進 Mesh Gradient 本身 -->
<div class="mesh"><div class="b1">健康穿戴</div><div class="b2">美妝保健</div><div class="b3">生活風格</div><div class="b4">SaaS</div></div>
<main>
  <div class="kicker">Pulseband · 全天候健康穿戴</div>
  <h1>Feel Every <span>Heartbeat of Data</span></h1>
  <p>背景是四團高斯模糊的色塊各自用不同速度飄動、縮放，純 CSS radial 色塊 + blur + keyframe animation 就能做出高階 Mesh Gradient 質感，不需要任何圖片。</p>
  <a class="cta" href="#">預購 Pulseband Pro →</a>
</main>
<div class="cards">
  <div><b>98</b><span>Sleep Score</span></div>
  <div><b>7d 全電力</b><span>Battery Life</span></div>
  <div><b>±1bpm</b><span>HR Accuracy</span></div>
</div>
</body>
</html>
