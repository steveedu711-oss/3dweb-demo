<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashwing — Drone Delivery Network</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f2f6f2;color:#0f1c14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(15,28,20,.06);border:1px solid rgba(15,28,20,.15)}
  .badge b{color:#1c9d5c}
  .intro{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#1c9d5c;font-weight:800;margin-bottom:16px}
  h1{font-size:clamp(32px,5.6vw,58px);font-weight:800;letter-spacing:-.02em;max-width:700px}
  .pinsec{height:400vh;position:relative}
  .pin{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .step{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0}
  .step .n{font-size:13px;font-weight:800;color:#1c9d5c;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
  .step h2{font-size:clamp(28px,5vw,50px);font-weight:800;letter-spacing:-.02em;max-width:640px}
  .step p{color:#4a5a4e;max-width:440px;margin-top:16px;line-height:1.7}
  .progress{position:fixed;left:0;top:0;height:4px;background:#1c9d5c;z-index:20;width:0%}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Scroll Pin</b>（區塊固定不動，內容依捲動進度切換）</div>
<div class="progress" id="prog"></div>

<div class="intro">
  <div class="kicker">Dashwing · 無人機外送網路</div>
  <h1>四個步驟，15 分鐘送達</h1>
</div>

<div class="pinsec">
  <div class="pin">
    <div class="step" data-step="1"><div class="n">Step 01</div><h2>下單成立</h2><p>App 送出訂單，系統即時比對最近的補給站。</p></div>
    <div class="step" data-step="2"><div class="n">Step 02</div><h2>無人機派遣</h2><p>AI 排程演算法在 0.8 秒內指派最適合的機組。</p></div>
    <div class="step" data-step="3"><div class="n">Step 03</div><h2>自主飛行</h2><p>即時避障、動態調整航線，全程加密追蹤。</p></div>
    <div class="step" data-step="4"><div class="n">Step 04</div><h2>精準降落</h2><p>誤差小於 10 公分，安全降落在你家陽台。</p></div>
  </div>
</div>

<div class="intro"><h1>準備好體驗未來的外送了嗎？</h1></div>

<script>
const pinsec = document.querySelector('.pinsec');
const steps = [...document.querySelectorAll('.step')];
const prog = document.getElementById('prog');

function onScroll(){
  const rect = pinsec.getBoundingClientRect();
  const total = pinsec.offsetHeight - innerHeight;
  const scrolled = Math.min(Math.max(-rect.top, 0), total);
  const progress = total > 0 ? scrolled / total : 0;
  prog.style.width = (progress*100) + '%';

  const segment = 1 / steps.length;
  steps.forEach((step, i) => {
    const start = i * segment, end = start + segment;
    const local = (progress - start) / segment;
    let opacity = 0;
    if (progress >= start && progress < end) {
      opacity = local < 0.15 ? local/0.15 : (local > 0.85 ? (1-local)/0.15 : 1);
    } else if (i === steps.length - 1 && progress >= end) {
      opacity = 1;
    }
    step.style.opacity = Math.max(0, Math.min(1, opacity));
    step.style.transform = `translateY(${(1-opacity)*20}px)`;
  });
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
