<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonora AI — Generative Music Studio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{color:#101014;background:#eee7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  canvas{position:fixed;top:0;right:0;width:56vw;height:100vh;z-index:0;pointer-events:none}
  @media (max-width:900px){canvas{width:100vw;opacity:.55}}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(16,16,20,.06);border:1px solid rgba(16,16,20,.12)}
  .badge b{color:#8e3bff}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 6vw;max-width:620px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8e3bff;font-weight:800;margin-bottom:20px}
  h1{font-size:clamp(36px,6.4vw,74px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
  p{color:#5b5468;font-size:17px;max-width:440px;margin:24px 0 34px;line-height:1.7}
  .cta{display:inline-flex;padding:15px 30px;border-radius:999px;background:#101014;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Morphing Blob</b>（Vertex Shader 有機變形，隨模擬音波振幅呼吸）</div>
<canvas id="c"></canvas>
<main>
  <div class="kicker">Sonora AI · 生成式音樂工作室</div>
  <h1>Music That Shapes Itself</h1>
  <p>右側的球體用 Vertex Shader 依 3D noise 位移頂點，振幅隨模擬音波節奏起伏，做出「隨旋律呼吸」的視覺效果——跟真的音樂生成邏輯無關，純視覺演算。</p>
  <a class="cta">產生你的第一首曲子 →</a>
</main>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
function size(){ const w=canvas.clientWidth, h=canvas.clientHeight; renderer.setSize(w,h,false); return w/h; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, size(), 0.1, 100);
camera.position.z = 4;
scene.add(new THREE.AmbientLight(0xffffff, .5));
const l1 = new THREE.PointLight(0x8e3bff, 3, 20); l1.position.set(3,2,3); scene.add(l1);
const l2 = new THREE.PointLight(0xff6bcb, 2.2, 20); l2.position.set(-3,-2,2); scene.add(l2);

const noiseGLSL = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const geo = new THREE.IcosahedronGeometry(1.15, 64);
const mat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0}, uAmp:{value:0.22}, uA:{value:new THREE.Color(0x8e3bff)}, uB:{value:new THREE.Color(0xff6bcb)} },
  vertexShader: `${noiseGLSL}
    uniform float uTime, uAmp; varying float vN; varying vec3 vNormal;
    void main(){
      float n = snoise(position*1.7 + uTime*0.4);
      vN = n; vNormal = normal;
      vec3 d = position + normal * n * uAmp;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(d,1.0);
    }`,
  fragmentShader: `
    varying float vN; varying vec3 vNormal; uniform vec3 uA; uniform vec3 uB;
    void main(){
      float fres = pow(1.0-abs(vNormal.z), 2.2);
      vec3 base = mix(uA, uB, vN*0.5+0.5);
      gl_FragColor = vec4(base + fres*0.4, 1.0);
    }`
});
const blob = new THREE.Mesh(geo, mat);
scene.add(blob);

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  mat.uniforms.uTime.value = t;
  // 模擬音波節奏：多個 sine 疊加當作假想的 beat 振幅
  const beat = Math.abs(Math.sin(t*2.4)) * 0.5 + Math.abs(Math.sin(t*0.7)) * 0.3;
  mat.uniforms.uAmp.value += ((0.16 + beat*0.28) - mat.uniforms.uAmp.value) * 0.15;
  blob.rotation.y = t*0.18;
  renderer.render(scene, camera);
}
tick();
addEventListener('resize', () => { camera.aspect = size(); camera.updateProjectionMatrix(); });
</script>
</body>
</html>
