<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovate AI — Before &amp; After Renovation</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1115;color:#eef0f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .badge b{color:#5ec9ff}
  header{text-align:center;padding:80px 24px 30px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5ec9ff;margin-bottom:16px}
  h1{font-size:clamp(30px,5.2vw,52px);font-weight:700;letter-spacing:-.02em}
  p{color:#9aa3c4;max-width:480px;margin:16px auto 0;line-height:1.7}

  .compare{position:relative;max-width:820px;height:56vh;margin:50px auto 100px;border-radius:20px;overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.5);cursor:ew-resize;user-select:none}
  .pane{position:absolute;inset:0;display:flex;align-items:flex-end;padding:24px}
  .after{background:linear-gradient(160deg,#dfe9f0,#b9cdd9);color:#0f1115}
  .before{background:linear-gradient(160deg,#3a352c,#1c1712);color:#e8e0d4}
  .before{clip-path:inset(0 0 0 0)}
  .label{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  .after .label{background:rgba(255,255,255,.5);color:#0f1115}
  .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;transform:translateX(-50%);box-shadow:0 0 20px rgba(0,0,0,.5)}
  .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:44px;height:44px;border-radius:50%;background:#fff;color:#0f1115;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Split-Screen Drag Compare</b>（拖曳滑桿左右對比前後差異）</div>
<header>
  <div class="kicker">Renovate AI · 智慧裝修設計</div>
  <h1>See the Transformation, Instantly</h1>
  <p>拖曳中間的滑桿，用 clip-path 控制「裝修前」圖層的顯示範圍，做出經典的前後對比互動——常用於裝潢、健身轉變、修圖類網站。</p>
</header>

<div class="compare" id="compare">
  <div class="pane after"><span class="label">AFTER · 裝修後</span></div>
  <div class="pane before" id="beforePane"><span class="label">BEFORE · 裝修前</span></div>
  <div class="handle" id="handle"></div>
</div>

<script>
const compare = document.getElementById('compare');
const beforePane = document.getElementById('beforePane');
const handle = document.getElementById('handle');

function setPos(pct){
  pct = Math.max(0, Math.min(100, pct));
  beforePane.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
  handle.style.left = pct + '%';
}
setPos(50);

let dragging = false;
function posFromEvent(e){
  const r = compare.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return (x / r.width) * 100;
}
compare.addEventListener('pointerdown', (e) => { dragging = true; setPos(posFromEvent(e)); });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', (e) => { if (dragging) setPos(posFromEvent(e)); });
</script>
</body>
</html>
