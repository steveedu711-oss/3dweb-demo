<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Aesthetics — Med Spa</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fbf3ef;color:#2b201c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;cursor:none;min-height:100vh}
  canvas{position:fixed;inset:0;z-index:5;pointer-events:none}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(43,32,28,.06);border:1px solid rgba(43,32,28,.15);cursor:auto}
  .badge b{color:#c98a63}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c98a63;margin-bottom:20px}
  h1{font-size:clamp(34px,6vw,64px);font-weight:500;letter-spacing:-.01em;max-width:700px;font-family:Georgia,serif}
  p{color:#7a685f;max-width:460px;margin:20px auto 34px;line-height:1.8}
  .cta{display:inline-flex;padding:14px 30px;border-radius:999px;border:1px solid #2b201c;font-weight:600}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Cursor Trail</b>（自訂游標拖出柔光殘影軌跡）</div>
<canvas id="c"></canvas>
<main>
  <div class="kicker">Lumen Aesthetics · 醫學美容診所</div>
  <h1>Radiance, Gently Revealed</h1>
  <p>游標本身被隱藏，改用柔和的光點殘影跟隨滑鼠移動、緩緩淡出——比起銳利的鼠標，這種柔光軌跡更貼近醫美品牌想傳達的溫柔質感。</p>
  <a class="cta">預約諮詢 →</a>
</main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const trail = [];
addEventListener('mousemove', (e) => {
  trail.push({ x: e.clientX, y: e.clientY, life: 1 });
  if (trail.length > 40) trail.shift();
});

function tick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let i=0;i<trail.length;i++){
    const p = trail[i];
    p.life -= 0.025;
    const r = 14 * (i/trail.length) + 2;
    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.4);
    grad.addColorStop(0, `rgba(201,138,99,${Math.max(0,p.life)*0.5})`);
    grad.addColorStop(1, 'rgba(201,138,99,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, r*2.4, 0, Math.PI*2); ctx.fill();
  }
  while (trail.length && trail[0].life <= 0) trail.shift();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
