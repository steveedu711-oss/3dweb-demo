<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroTrace — Zero Trust Security</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05070a;color:#e8ecf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden;min-height:100vh;position:relative}
  .grid-bg{
    position:fixed;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size:46px 46px;
  }
  .spotlight{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle 260px at var(--x,50%) var(--y,50%), rgba(0,255,170,.16), rgba(0,255,170,.04) 40%, transparent 70%);
    transition:background .05s linear;
  }
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px)}
  .badge b{color:#00ffaa}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#00ffaa;margin-bottom:20px;font-family:monospace}
  h1{font-size:clamp(36px,6.6vw,72px);font-weight:700;letter-spacing:-.02em;line-height:1.08;max-width:820px;font-family:monospace}
  h1 span{color:#00ffaa}
  p{color:#8b93a8;font-size:16px;max-width:520px;margin:22px 0 34px;line-height:1.7;font-family:monospace}
  .cta{display:inline-flex;gap:10px;padding:14px 28px;border:1px solid #00ffaa;color:#00ffaa;font-family:monospace;font-weight:700;border-radius:4px}
  .hint{position:relative;z-index:1;margin-top:50px;font-size:12px;color:#4a5468;font-family:monospace}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Cursor Spotlight</b>（游標光暈遮罩，用 CSS 變數即時更新）</div>
<div class="grid-bg"></div>
<div class="spotlight" id="spot"></div>
<main>
  <div class="kicker">// ZERO_TRACE.SEC — zero-trust access control</div>
  <h1>Never Trust. <span>Always Verify.</span></h1>
  <p>移動滑鼠，光暈會照亮底下的網格。原理是用 mousemove 即時更新 CSS 自訂屬性 --x/--y，radial-gradient 跟著座標重繪，不需要任何 canvas 或 WebGL。</p>
  <a class="cta">$ deploy zero-trust-policy →</a>
  <div class="hint">cursor position drives --x --y in real time</div>
</main>
<script>
const spot = document.getElementById('spot');
addEventListener('mousemove', (e) => {
  spot.style.setProperty('--x', e.clientX + 'px');
  spot.style.setProperty('--y', e.clientY + 'px');
});
</script>
</body>
</html>
