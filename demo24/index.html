<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sterling &amp; Cross — Personal Injury Law</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e1116;color:#eef0f4;font-family:Georgia,"Noto Serif TC",serif;min-height:100vh}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);font-family:-apple-system,sans-serif}
  .badge b{color:#c9a24a}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c9a24a;margin-bottom:24px;font-family:-apple-system,sans-serif}
  h1{font-size:clamp(30px,6vw,64px);font-weight:400;letter-spacing:0;max-width:820px;line-height:1.3}
  .kw{display:inline-block;transition:font-weight .08s linear, letter-spacing .08s linear, transform .08s linear;color:#c9a24a}
  p{font-family:-apple-system,sans-serif;color:#9a9ea8;max-width:460px;margin:26px auto 0;line-height:1.7;font-size:15px}
  .hint{margin-top:18px;font-family:-apple-system,sans-serif;font-size:12px;color:#5c606c;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Kinetic Typography</b>（文字粗細依捲動速度即時變化）</div>
<main>
  <div class="kicker">Sterling &amp; Cross · 人身傷害律師事務所</div>
  <h1>We fight for the <span class="kw" id="kw1">justice</span> you deserve, with <span class="kw" id="kw2">relentless</span> resolve.</h1>
  <p>捲動頁面時，關鍵字的字重（font-weight）與字距會依捲動速度即時變化——速度越快字越粗、越張揚，靜止時回到正常粗細，是強調權威感文案常見的手法。</p>
  <!-- 適合產業直接是被套用同一組動態字重效果的關鍵字，不是額外貼上去的標籤 -->
  <p style="margin-top:14px">最適合 <span class="kw" id="kw3">人身傷害律師事務所</span> 這類需要權威感的產業。</p>
  <div class="hint">↓ 捲動看關鍵字變化 ↓</div>
  <div style="height:60vh"></div>
</main>

<script>
const kws = [document.getElementById('kw1'), document.getElementById('kw2'), document.getElementById('kw3')];
let lastY = scrollY, velocity = 0;

function onScroll(){
  const y = scrollY;
  velocity = velocity * 0.7 + (y - lastY) * 0.3;
  lastY = y;
}
addEventListener('scroll', onScroll, { passive: true });

function tick(){
  requestAnimationFrame(tick);
  const speed = Math.min(Math.abs(velocity), 40);
  const weight = 400 + speed * 12;
  const spread = speed * 0.6;
  const scale = 1 + speed * 0.01;
  kws.forEach(el => {
    el.style.fontWeight = weight;
    el.style.letterSpacing = spread + 'px';
    el.style.transform = `scale(${scale})`;
  });
  velocity *= 0.9;
}
tick();
</script>
</body>
</html>
