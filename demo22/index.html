<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista Realty — Property Showcase</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#101214;color:#f0f1f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .badge b{color:#e8b866}
  header{text-align:center;padding:80px 24px 20px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#e8b866;margin-bottom:16px}
  h1{font-size:clamp(30px,5.2vw,52px);font-weight:700;letter-spacing:-.02em}
  p{color:#9a9da5;max-width:480px;margin:16px auto 0;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:940px;margin:50px auto 100px;padding:0 24px}
  .tile{position:relative;height:260px;border-radius:16px;overflow:hidden}
  .tile canvas{width:100%;height:100%;display:block}
  .tile .label{position:absolute;left:16px;bottom:14px;font-weight:700;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:8px;backdrop-filter:blur(4px);pointer-events:none}
</style>
</head>
<body>
<div class="badge">效果類型：<b>WebGL Image Distortion Hover</b>（滑過即時 RGB 位移 + 魚眼扭曲）</div>
<header>
  <div class="kicker">Vista Realty · 精選物件</div>
  <h1>Every Listing, Larger Than Life</h1>
  <p>滑鼠移到物件照片上會即時扭曲、產生 RGB 色差位移，用 WebGL fragment shader 依游標距離運算貼圖 UV 偏移，是作品集網站常見的高階互動。</p>
</header>
<div class="grid" id="grid"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const colors = [[0x8fa6c9,0x2a3448],[0xc9a76b,0x3a2f1e],[0x9bb98f,0x233020],[0xb98f9b,0x30222a]];
const labels = ['Cliffside Modern','Harbor Loft','Meadow Estate','Skyline Residence'];
const grid = document.getElementById('grid');

colors.forEach((cols, idx) => {
  const tile = document.createElement('div');
  tile.className = 'tile';
  const canvas = document.createElement('canvas');
  tile.appendChild(canvas);
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = labels[idx];
  tile.appendChild(label);
  grid.appendChild(tile);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  function size(){ const w = tile.clientWidth, h = tile.clientHeight; renderer.setSize(w,h,false); return {w,h}; }
  const {w,h} = size();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const scene = new THREE.Scene();

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uMouse: { value: new THREE.Vector2(0.5,0.5) },
      uHover: { value: 0 },
      uColorA: { value: new THREE.Color(cols[0]) },
      uColorB: { value: new THREE.Color(cols[1]) }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position = vec4(position,1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform vec2 uMouse; uniform float uHover;
      uniform vec3 uColorA; uniform vec3 uColorB;
      void main(){
        vec2 uv = vUv;
        vec2 toMouse = uv - uMouse;
        float dist = length(toMouse);
        float bulge = uHover * 0.18 * smoothstep(0.5, 0.0, dist);
        vec2 duv = uv + normalize(toMouse+0.0001) * bulge;

        float shift = uHover * 0.02 * smoothstep(0.5,0.0,dist);
        float r = mix(uColorA.r, uColorB.r, duv.y + shift);
        float g = mix(uColorA.g, uColorB.g, duv.y);
        float b = mix(uColorA.b, uColorB.b, duv.y - shift);

        float grid = step(0.97, fract(duv.x*10.0)) * 0.06;
        gl_FragColor = vec4(r+grid, g+grid, b+grid, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));

  tile.addEventListener('mousemove', (e) => {
    const r = tile.getBoundingClientRect();
    mat.uniforms.uMouse.value.set((e.clientX-r.left)/r.width, 1-(e.clientY-r.top)/r.height);
  });
  tile.addEventListener('mouseenter', () => { targetHover = 1; });
  tile.addEventListener('mouseleave', () => { targetHover = 0; });
  let targetHover = 0;

  function tick(){
    requestAnimationFrame(tick);
    mat.uniforms.uHover.value += (targetHover - mat.uniforms.uHover.value) * 0.1;
    renderer.render(scene, camera);
  }
  tick();
  addEventListener('resize', size);
});
</script>
</body>
</html>
