<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Voyages — Space Tourism</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(circle at 50% 0%, #1a1042, #05030f 60%);color:#f2f0fb;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .badge b{color:#c9a6ff}
  .layer{position:relative;height:280vh}
  .pin{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .big{position:absolute;font-weight:800;letter-spacing:-.03em;white-space:nowrap;color:rgba(255,255,255,.08);font-size:22vw}
  .l1{top:8%}
  .l2{bottom:6%}
  .fg{position:relative;z-index:2;text-align:center;padding:0 24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c9a6ff;margin-bottom:18px}
  h1{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:-.02em;max-width:700px}
  h1 span{background:linear-gradient(135deg,#c9a6ff,#5ec9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a79fc4;max-width:460px;margin:20px auto 34px;line-height:1.7}
  .dot{position:absolute;border-radius:50%;background:#fff;opacity:.6}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Scroll Parallax Text</b>（多層文字/星點依捲動速度不同層次位移）</div>

<div class="layer">
  <div class="pin">
    <div class="big l1" data-speed="0.4">ORBIT</div>
    <div class="big l2" data-speed="-0.3">AURORA</div>
    <!-- 適合產業當作第三層視差大字，跟 ORBIT / AURORA 用同一套 data-speed 邏輯位移 -->
    <div class="big l3" data-speed="0.6" style="font-size:6vw;top:45%;opacity:.06">旅遊．太空．大敘事品牌</div>
    <div id="stars"></div>
    <div class="fg">
      <div class="kicker">Aurora Voyages · 太空旅遊</div>
      <h1>See Earth <span>From the Edge of Space</span></h1>
      <p>背景大字與星點各自綁定不同的捲動速度倍率，往下捲動時前後景層次分離，做出視覺深度——純 transform: translateY 依 scrollY 計算。</p>
    </div>
  </div>
</div>

<script>
const stars = document.getElementById('stars');
for (let i=0;i<60;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  const s = Math.random()*2.4+0.6;
  d.style.width = d.style.height = s+'px';
  d.style.left = Math.random()*100+'%';
  d.style.top = Math.random()*100+'%';
  d.dataset.speed = (Math.random()*0.6+0.1).toFixed(2);
  stars.appendChild(d);
}
const parallaxEls = [...document.querySelectorAll('[data-speed]')];
function onScroll(){
  const y = window.scrollY;
  for (const el of parallaxEls) {
    const speed = parseFloat(el.dataset.speed);
    el.style.transform = `translateY(${y*speed}px)`;
  }
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
