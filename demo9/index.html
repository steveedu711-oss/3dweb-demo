<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell AI — Prompt Writing Assistant</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0f14;color:#eef0f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .badge b{color:#ffd166}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#ffd166;margin-bottom:22px}
  h1{font-size:clamp(30px,5.5vw,54px);font-weight:700;letter-spacing:-.01em;line-height:1.3;max-width:820px;min-height:2.6em}
  .cursor{display:inline-block;width:3px;height:.9em;background:#ffd166;margin-left:4px;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  p{color:#9aa0b4;font-size:16px;max-width:480px;margin:26px 0 34px;line-height:1.7}
  .cta{display:inline-flex;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#ffd166,#ff9f4a);color:#0d0f14;font-weight:700}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Typewriter</b>（逐字打字機效果，多句循環）</div>
<main>
  <div class="kicker">Inkwell AI · 提示詞寫作助理</div>
  <h1 id="type"><span class="cursor"></span></h1>
  <p>標題文字用 JS 逐字打出、停頓、刪除、換下一句循環播放，是行銷頁常見的「打字機」互動，純字串操作不需要任何函式庫。</p>
  <a class="cta">開始免費寫作 →</a>
</main>

<script>
const phrases = [
  '把想法變成完美提示詞。',
  '一句話生成整份行銷文案。',
  '讓 AI 懂你真正想要的語氣。'
];
const el = document.getElementById('type');
const cursor = document.querySelector('.cursor');
let pi = 0, ci = 0, deleting = false;

function tick(){
  const full = phrases[pi];
  if (!deleting) {
    ci++;
    el.textContent = full.slice(0, ci);
    el.appendChild(cursor);
    if (ci === full.length) { deleting = true; setTimeout(tick, 1400); return; }
  } else {
    ci--;
    el.textContent = full.slice(0, ci);
    el.appendChild(cursor);
    if (ci === 0) { deleting = false; pi = (pi+1) % phrases.length; setTimeout(tick, 300); return; }
  }
  setTimeout(tick, deleting ? 35 : 70);
}
tick();
</script>
</body>
</html>
