<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerly — B2B Accounting SaaS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f5f6f8;color:#12141c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(18,20,28,.06);border:1px solid rgba(18,20,28,.15)}
  .badge b{color:#3a5bff}
  main{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#3a5bff;font-weight:800;margin-bottom:18px}
  h1{font-size:clamp(30px,5.4vw,54px);font-weight:800;letter-spacing:-.02em;max-width:700px}
  p{color:#5c6070;max-width:480px;margin:18px auto 0;line-height:1.7}

  .marquee-wrap{position:relative;padding:50px 0 110px;overflow:hidden}
  .marquee-wrap::before,.marquee-wrap::after{
    content:"";position:absolute;top:0;bottom:0;width:100px;z-index:2;
  }
  .marquee-wrap::before{left:0;background:linear-gradient(90deg,#f5f6f8,transparent)}
  .marquee-wrap::after{right:0;background:linear-gradient(-90deg,#f5f6f8,transparent)}
  .track{display:flex;gap:56px;width:max-content;animation:scroll 26s linear infinite}
  .track:hover{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .logo{
    display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#8a8fa3;
    padding:14px 22px;border-radius:14px;background:#fff;border:1px solid #e6e8ee;white-space:nowrap;
  }
  .logo i{width:10px;height:10px;border-radius:3px;background:#3a5bff;display:inline-block}
  .trust{text-align:center;font-size:12px;color:#8a8fa3;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Marquee Logo Wall</b>（客戶標誌牆無限橫向跑馬燈）</div>
<main>
  <div class="kicker">Ledgerly · B2B 記帳自動化平台</div>
  <h1>Trusted by Finance Teams Everywhere</h1>
  <p>下方的客戶標誌牆用兩份重複內容拼接、CSS keyframe 無限橫向位移做出跑馬燈效果，滑鼠移上去會暫停——B2B SaaS 最常見的信任感區塊。</p>
</main>

<div class="trust">Trusted by 2,000+ finance teams</div>
<div class="marquee-wrap">
  <div class="track" id="track"></div>
</div>

<script>
const names = ['Northwind','Vertex Labs','Cobalt & Co','Fjord Systems','Meridian','Anchorpoint','Solace Group','Lumen Works','Cascade Ledger','Ironclad Ops'];
const track = document.getElementById('track');
function renderSet(){
  const frag = document.createDocumentFragment();
  names.forEach(n => {
    const d = document.createElement('div');
    d.className = 'logo';
    d.innerHTML = `<i></i>${n}`;
    frag.appendChild(d);
  });
  // 適合產業直接當作跑馬燈裡的一塊「標誌」，跟其他 logo 一起橫向捲動，是效果本身的一部分
  const ind = document.createElement('div');
  ind.className = 'logo';
  ind.style.color = '#3a5bff';
  ind.innerHTML = `<i style="background:#fff;border:2px solid #3a5bff"></i>適合：B2B SaaS／顧問／企業服務`;
  frag.appendChild(ind);
  return frag;
}
track.appendChild(renderSet());
track.appendChild(renderSet());
</script>
</body>
</html>
