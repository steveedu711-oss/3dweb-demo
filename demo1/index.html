<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qubitron — Quantum Cloud Computing</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#04050a;color:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
  canvas{position:fixed;inset:0;z-index:0}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);letter-spacing:.02em}
  .badge b{color:#7cf5ff}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7cf5ff;margin-bottom:20px}
  h1{font-size:clamp(38px,7vw,78px);font-weight:700;letter-spacing:-.02em;line-height:1.05;max-width:820px;text-shadow:0 6px 40px rgba(0,0,0,.7)}
  h1 span{background:linear-gradient(135deg,#7cf5ff,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a9aecb;font-size:17px;max-width:520px;margin:22px 0 34px;line-height:1.7}
  .cta{display:inline-flex;gap:10px;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#7c5cff,#4b2fd6);
    font-weight:700;box-shadow:0 12px 30px rgba(124,92,255,.4)}
  .metrics{position:relative;z-index:1;display:flex;gap:50px;justify-content:center;padding:0 24px 90px;flex-wrap:wrap}
  .metrics div b{display:block;font-size:32px;font-weight:700;color:#7cf5ff}
  .metrics div span{font-size:12px;color:#8a90ad;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Shader Animation</b>（自訂 GLSL 即時運算背景）</div>
<canvas id="c"></canvas>
<main>
  <div class="kicker">Qubitron Cloud · 量子雲端運算</div>
  <h1>Compute at the <span>Speed of Superposition</span></h1>
  <p>背景是一個包住鏡頭的球體，內壁貼著自訂 Fragment Shader，每一幀都在 GPU 上即時運算出流動的量子場噪聲，不是任何靜態圖片或影片。</p>
  <a class="cta" href="#">申請早鳥算力 →</a>
</main>
<div class="metrics">
  <div><b>512</b><span>Logical Qubits</span></div>
  <div><b>0.3ms</b><span>Gate Latency</span></div>
  <div><b>99.98%</b><span>Fidelity</span></div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 4;

const geo = new THREE.SphereGeometry(50, 48, 48);
const mat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(0,0) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec2 uMouse; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
    }
    void main(){
      vec2 uv = vUv*4.0;
      float n=0.0, amp=0.55;
      for(int i=0;i<5;i++){ n += noise(uv + uTime*0.03*float(i+1)) * amp; uv*=1.8; amp*=0.55; }
      float grid = step(0.985, fract(vUv.x*40.0)) + step(0.985, fract(vUv.y*40.0));
      vec3 base = mix(vec3(0.01,0.02,0.08), vec3(0.05,0.35,0.55), n);
      vec3 col = base + grid*vec3(0.1,0.5,0.6)*0.15;
      gl_FragColor = vec4(col,1.0);
    }
  `
});
scene.add(new THREE.Mesh(geo, mat));

const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1, 3),
  new THREE.MeshBasicMaterial({ color: 0x7cf5ff, wireframe: true, transparent: true, opacity: 0.5 })
);
scene.add(core);

const mouse = { x:0, y:0 };
addEventListener('mousemove', e => { mouse.x=(e.clientX/innerWidth-0.5)*2; mouse.y=(e.clientY/innerHeight-0.5)*2; });

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  mat.uniforms.uTime.value = t;
  core.rotation.y = t*0.25 + mouse.x*0.4;
  core.rotation.x = mouse.y*0.3;
  renderer.render(scene, camera);
}
tick();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
