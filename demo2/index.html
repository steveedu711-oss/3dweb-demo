<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestra AI — Autonomous Agent Platform</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050608;color:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
  canvas{position:fixed;inset:0;z-index:0}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px)}
  .badge b{color:#ffb454}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffb454;margin-bottom:20px}
  h1{font-size:clamp(38px,7vw,76px);font-weight:700;letter-spacing:-.02em;line-height:1.06;max-width:820px;text-shadow:0 6px 40px rgba(0,0,0,.7)}
  h1 span{background:linear-gradient(135deg,#ffb454,#ff5d3b);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a3a8b8;font-size:17px;max-width:520px;margin:22px 0 34px;line-height:1.7}
  .cta{display:inline-flex;gap:10px;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#ff5d3b,#c93a1f);
    font-weight:700;box-shadow:0 12px 30px rgba(255,93,59,.4)}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Particle Field</b>（互動粒子場 + 動態連線網路）</div>
<canvas id="c"></canvas>
<main>
  <div class="kicker">Orchestra AI · 自主代理協作平台</div>
  <h1>Thousands of Agents, <span>One Orchestration</span></h1>
  <p>背景粒子代表正在運作的自主 Agent，靠近彼此會即時連線成網路，滑鼠移動會排開周圍粒子——全部用 Canvas 2D 逐幀運算，不是預錄動畫。</p>
  <a class="cta" href="#">部署你的第一組 Agent →</a>
</main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); addEventListener('resize', resize);

const COUNT = Math.min(140, Math.floor(innerWidth/9));
const particles = Array.from({length: COUNT}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
  r: Math.random()*1.6+1
}));

const mouse = { x: -9999, y: -9999 };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

function tick(){
  ctx.clearRect(0,0,W,H);
  for (const p of particles) {
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const d = Math.hypot(dx, dy);
    if (d < 120) { const f = (120-d)/120*0.6; p.vx += (dx/d)*f*0.06; p.vy += (dy/d)*f*0.06; }
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.985; p.vy *= 0.985;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    p.x = Math.max(0, Math.min(W, p.x));
    p.y = Math.max(0, Math.min(H, p.y));
  }
  for (let i=0;i<particles.length;i++){
    for (let j=i+1;j<particles.length;j++){
      const a = particles[i], b = particles[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d < 110) {
        ctx.strokeStyle = `rgba(255,180,84,${(1-d/110)*0.35})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
  }
  for (const p of particles) {
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,180,84,0.9)';
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
