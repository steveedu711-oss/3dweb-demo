<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyssum — Deep-Sea Exploration Robotics</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#020608;color:#e6f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  canvas#webgl{position:fixed;inset:0;z-index:0}
  .badge{position:fixed;top:18px;left:18px;z-index:10;font-size:12px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px)}
  .badge b{color:#2dd4bf}
  header,.story{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#2dd4bf;margin-bottom:18px}
  h1{font-size:clamp(36px,6.6vw,72px);font-weight:700;letter-spacing:-.02em;line-height:1.06;max-width:800px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
  h1 span,.story h2 i{color:#2dd4bf;font-style:normal}
  p{color:#9db3b6;max-width:480px;margin:20px auto 0;line-height:1.7}
  .story h2{font-size:clamp(28px,5vw,52px);font-weight:600;line-height:1.25;max-width:700px;text-shadow:0 4px 24px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="badge">效果類型：<b>Scroll-driven Camera</b>（GSAP ScrollTrigger 綁定鏡頭 z 軸與物件旋轉）</div>
<canvas id="webgl"></canvas>

<header>
  <div class="kicker">Abyssum Robotics · 深海探測機器人</div>
  <h1>Go Where <span>Light Can't Reach</span></h1>
  <p>捲動頁面時，背後的線框潛航器與鏡頭會依捲動進度縮放、旋轉，做出「潛入深海」的一鏡到底敘事效果。</p>
</header>

<section class="story" data-story="1"><h2>11,000 公尺深，<i>仍能穩定通訊</i>。</h2></section>
<section class="story" data-story="2"><h2>AI 即時避障，<i>自主規劃航線</i>。</h2></section>
<section class="story" data-story="3"><h2>把海溝的秘密，<i>帶回水面</i>。</h2></section>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x021014, 0.045);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,7);

scene.add(new THREE.AmbientLight(0x2dd4bf, .6));
const l = new THREE.PointLight(0x2dd4bf, 3, 30); l.position.set(3,2,4); scene.add(l);

const sub = new THREE.Group();
scene.add(sub);
const hull = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.8, 1.6, 6, 12),
  new THREE.MeshBasicMaterial({ color: 0x2dd4bf, wireframe: true, transparent: true, opacity: .6 })
);
sub.add(hull);
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 1), new THREE.MeshStandardMaterial({ color: 0x0af0c8, emissive: 0x0af0c8, emissiveIntensity: 0.6, metalness: .7, roughness: .3 }));
sub.add(core);

// 適合產業標籤：貼在潛航器上一起隨鏡頭捲動旋轉，是場景本身的一部分
function makeLabel(text){
  const c = document.createElement('canvas'); c.width=256; c.height=64;
  const cx = c.getContext('2d');
  cx.font='600 26px -apple-system, sans-serif'; cx.fillStyle='#8fe9de';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.shadowColor='#2dd4bf'; cx.shadowBlur=14;
  cx.fillText(text,128,32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false }));
  s.scale.set(1.8,0.45,1);
  return s;
}
const indLabel = makeLabel('適合：重工業／科研／探索類');
indLabel.position.set(0, 1.3, 0);
sub.add(indLabel);

// 氣泡粒子
const bubbleCount = 200;
const pos = new Float32Array(bubbleCount*3);
for (let i=0;i<bubbleCount;i++){ pos[i*3]=(Math.random()-0.5)*20; pos[i*3+1]=(Math.random()-0.5)*20; pos[i*3+2]=(Math.random()-0.5)*20; }
const bubbleGeo = new THREE.BufferGeometry();
bubbleGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
const bubbles = new THREE.Points(bubbleGeo, new THREE.PointsMaterial({ color: 0x8fe9de, size: 0.04, transparent: true, opacity: .5 }));
scene.add(bubbles);

const target = { camZ: 7, rotY: 0, scale: 1 };
document.querySelectorAll('.story').forEach((el) => {
  const s = el.dataset.story;
  const cfg = { '1':[4.2, Math.PI*0.5, 1.3], '2':[2.4, Math.PI*1.2, 1.7], '3':[6, Math.PI*1.8, 1] }[s];
  gsap.to(target, { camZ: cfg[0], rotY: cfg[1], scale: cfg[2], ease:'none',
    scrollTrigger:{ trigger: el, start:'top bottom', end:'bottom top', scrub:1 } });
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  camera.position.z += (target.camZ - camera.position.z)*0.06;
  camera.lookAt(0,0,0);
  sub.rotation.y += (target.rotY - sub.rotation.y)*0.06;
  sub.rotation.z = Math.sin(t*0.5)*0.08;
  const s = target.scale;
  sub.scale.x += (s-sub.scale.x)*0.06; sub.scale.y += (s-sub.scale.y)*0.06; sub.scale.z += (s-sub.scale.z)*0.06;
  bubbles.rotation.y += 0.0007;
  bubbles.position.y = (bubbles.position.y + 0.004) % 5;
  renderer.render(scene, camera);
}
tick();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
